# What goes in the directory.
#
# Labs (academic + independent institutes) are DISCOVERED automatically: for every
# university / institute below, Claude finds all bioinformatics / computational-biology
# labs and writes them to config/labs.discovered.yaml. You then sort them by fit on the site.
# Labs listed under `labs:` are always included (use it for notable PIs anywhere).
#
# Companies are listed by hand below (order = rank).
#
# ids: lowercase, never change one (your notes are keyed on it).

universities:
  US: [Stanford University, Harvard University, MIT, Princeton University, Caltech]
  UK: [University of Cambridge, University College London, University of Oxford]
  # Imperial College London: add it to the UK list to include it

institutes:
  US: [Arc Institute, Broad Institute, Scripps Research, New York Genome Center, Chan Zuckerberg Biohub]
  UK: [Wellcome Sanger Institute, Francis Crick Institute, EMBL-EBI, The Institute of Cancer Research, MRC Laboratory of Molecular Biology]

# Always-included labs (notable PIs anywhere, or labs discovery missed)
labs:
  - { id: stanford-curtis, name: Curtis Lab, pi: Christina Curtis, institution: Stanford University, region: US, category: academic }
  - { id: arc-goodarzi, name: Goodarzi Lab, pi: Hani Goodarzi, institution: Arc Institute, region: US, category: institute }
  - { id: other-vanloo, name: Van Loo Lab, pi: Peter Van Loo, institution: MD Anderson Cancer Center, region: US, category: academic, group: Notable PIs }
  - { id: other-alexandrov, name: Alexandrov Lab, pi: Ludmil Alexandrov, institution: UC San Diego, region: US, category: academic, group: Notable PIs }
  - { id: other-getz, name: Getz Lab, pi: Gad Getz, institution: Broad Institute / MGH, region: US, category: academic, group: Notable PIs }
  - { id: other-ding, name: Ding Lab, pi: Li Ding, institution: Washington University in St. Louis, region: US, category: academic, group: Notable PIs }
  - { id: other-ideker, name: Ideker Lab, pi: Trey Ideker, institution: UC San Diego, region: US, category: academic, group: Notable PIs }

companies:
  bigtech:
    - { id: bt-deepmind, name: Google DeepMind, hint: "science / biology teams, AlphaFold, AlphaGenome" }
    - { id: bt-google-research, name: Google Research, hint: "health & genomics teams, DeepVariant" }
    - { id: bt-openai, name: OpenAI, hint: "life sciences / OpenAI for Science" }
    - { id: bt-anthropic, name: Anthropic, hint: "Claude for Life Sciences, AI for science" }
    - { id: bt-microsoft, name: Microsoft Research, hint: "AI for Science, Health Futures" }
    - { id: bt-nvidia, name: NVIDIA, hint: "BioNeMo, digital biology research" }
    - { id: bt-meta, name: Meta FAIR, hint: "biology / chemistry research" }
    - { id: bt-amazon, name: Amazon / AWS, hint: "health AI, life sciences" }
    - { id: bt-calico, name: Calico (Alphabet) }
    - { id: bt-ibm, name: IBM Research, hint: "computational biology / healthcare" }
  biotech:
    - { id: bio-genentech, name: Genentech, hint: "Research and Early Development, computational sciences, Prescient Design" }
    - { id: bio-lilly, name: Eli Lilly, hint: "TuneLab, computational biology" }
    - { id: bio-tempus, name: Tempus AI }
    - { id: bio-ginkgo, name: Ginkgo Bioworks }
    - { id: bio-illumina, name: Illumina, hint: "AI / computational genomics" }
    - { id: bio-regeneron, name: Regeneron Genetics Center }
    - { id: bio-astrazeneca, name: AstraZeneca, hint: "oncology R&D, data science & AI" }
    - { id: bio-grail, name: GRAIL }
    - { id: bio-fmi, name: Foundation Medicine }
    - { id: bio-recursion, name: Recursion }
  startup:
    - { id: st-isomorphic, name: Isomorphic Labs }
    - { id: st-chai, name: Chai Discovery }
    - { id: st-xaira, name: Xaira Therapeutics }
    - { id: st-evoscale, name: EvolutionaryScale }
    - { id: st-noetik, name: Noetik, hint: "AI for cancer biology" }
    - { id: st-generate, name: Generate:Biomedicines }
    - { id: st-profluent, name: Profluent }
    - { id: st-latent, name: Latent Labs }
    - { id: st-bioptimus, name: Bioptimus }
    - { id: st-inceptive, name: Inceptive }
