# Seed list: WHICH labs / institutes / companies are in the directory.
# The weekly refresh fills in everything else (people, summary, programs, contacts, links).
#
# Lab names below are a starting point from public knowledge as of mid-2026.
# The first refresh confirms each PI's current affiliation and flags anyone who has moved.
# Run the workflow with "discover" ticked to get suggested additions per university
# (they appear under "What's new" > Suggestions; copy the ones you want in here).
#
# Fields:
#   id         unique, lowercase, never change it (your notes are keyed on it)
#   name       display name
#   pi         PI / lead name (academic) - helps the search find the right lab
#   hint       optional extra words or URL to disambiguate
#   enabled    false = skip without deleting (notes are kept)

academic:
  US:
    Stanford University:
      - { id: stanford-curtis, name: Curtis Lab, pi: Christina Curtis }
      - { id: stanford-ji, name: Ji Lab, pi: Hanlee Ji }
      - { id: stanford-alizadeh, name: Alizadeh Lab, pi: Ash Alizadeh }
      - { id: stanford-kundaje, name: Kundaje Lab, pi: Anshul Kundaje }
