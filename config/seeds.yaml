  UK:
    University of Cambridge:
      - { id: cam-markowetz, name: Markowetz Lab, pi: Florian Markowetz, hint: "CRUK Cambridge Institute" }
      - { id: cam-nikzainal, name: Nik-Zainal Lab, pi: Serena Nik-Zainal }
    University College London:
      - { id: ucl-mcgranahan, name: McGranahan Lab, pi: Nicholas McGranahan, hint: "UCL Cancer Institute" }
      - { id: ucl-swanton, name: Swanton Lab, pi: Charles Swanton, hint: "Francis Crick Institute / UCL" }
    University of Oxford:
      - { id: ox-yau, name: Yau Lab, pi: Christopher Yau }
      - { id: ox-schusterbockler, name: Schuster-Böckler Lab, pi: Benjamin Schuster-Böckler, hint: "Ludwig Oxford" }
    Imperial College London:
      # You asked for 3 UK universities; Imperial is off by default. Set enabled: true to include it.
      - { id: imperial-placeholder, name: "Imperial - fill in", pi: "", enabled: false }
  Other:
    # High-profile PIs outside the universities above
    Notable PIs:
      - { id: other-vanloo, name: Van Loo Lab, pi: Peter Van Loo, hint: "MD Anderson" }
      - { id: other-alexandrov, name: Alexandrov Lab, pi: Ludmil Alexandrov, hint: "UC San Diego" }
