<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach Directory</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo"></span>Outreach Directory</div>
  <nav class="nav" id="nav">
    <a data-view="directory">Directory</a>
    <a data-view="programs">Programs &amp; deadlines</a>
    <a data-view="outreach">My outreach</a>
    <a data-view="news">What's new <span class="dot" id="newsCount" hidden></span></a>
  </nav>
  <div class="tb-right">
    <span class="refresh" id="refreshInfo"><i></i>Loading…</span>
    <button class="btn" id="refreshNow" title="Run the refresh job now">Refresh now</button>
  </div>
</header>
<div id="banner" class="banner" hidden></div>
<main id="app"></main>
<aside id="drawer" class="drawer" hidden></aside>
<div id="scrim" class="scrim" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
