<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach Directory</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-inner">
      <div class="brand">Outreach Directory</div>
      <nav class="nav" id="nav">
        <a data-view="directory">Directory</a>
        <a data-view="programs">Programs</a>
        <a data-view="news">What's new <span class="badge" id="newsCount" hidden></span></a>
      </nav>
      <div class="meta" id="refreshInfo"></div>
    </div>
    <div id="banner" class="banner" hidden></div>
  </div>
</header>
<main id="app" class="wrap"></main>
<aside id="drawer" class="drawer" hidden></aside>
<div id="scrim" class="scrim" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
