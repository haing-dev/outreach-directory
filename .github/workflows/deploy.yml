name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["public/data/**", "README.md"]
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN: { required: false }
      CLOUDFLARE_ACCOUNT_ID: { required: false }
      SITE_PASSWORD: { required: false }
      REFRESH_TOKEN: { required: false }

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up data just committed by the refresh job
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Set up Cloudflare and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: bash scripts/deploy.sh
