name: Weekly refresh

on:
  schedule:
    - cron: "0 13 * * 1"   # weekly full refresh (skipped while hourly batch mode is on)
    - cron: "17 * * * *"   # hourly batch (config/batch.yaml)
  push:
    branches: [main]
    paths: ["config/run-request.yaml", "config/batch.yaml"]   # Claude starts runs from chat by pushing this file
  workflow_dispatch:
    inputs:
      only:
        description: "Only these ids (comma-separated), e.g. stanford-curtis. Blank = everything"
        required: false
        default: ""
      category:
        description: "Only one category (academic, institute, bigtech, biotech, startup). Blank = all"
        required: false
        default: ""
      discover:
        description: "Also suggest new labs per university"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code (used when CLAUDE_TOKEN is a subscription token)
        run: npm install -g @anthropic-ai/claude-code

      - name: Refresh directory with Claude
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_TOKEN }}
          CLAUDE_BASE_URL: ${{ vars.CLAUDE_BASE_URL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT }}
          WORKERS: ${{ vars.WORKERS }}
          MAX_SEARCHES: ${{ vars.MAX_SEARCHES }}
          COLLECT_EMAILS: ${{ github.event.repository.private }}
          IN_ONLY: ${{ inputs.only }}
          IN_CATEGORY: ${{ inputs.category }}
          IN_DISCOVER: ${{ inputs.discover }}
        run: |
          ARGS=()
          [ -n "$IN_ONLY" ] && ARGS+=(--only "$IN_ONLY")
          [ -n "$IN_CATEGORY" ] && ARGS+=(--category "$IN_CATEGORY")
          [ "$IN_DISCOVER" = "true" ] && ARGS+=(--discover all)
          if [ "${{ github.event_name }}" = "push" ]; then
            if git diff --name-only HEAD~1 HEAD | grep -q "config/batch.yaml"; then ARGS+=(--batch); else ARGS+=(--request config/run-request.yaml); fi
          fi
          if [ "${{ github.event.schedule }}" = "17 * * * *" ]; then ARGS+=(--batch); fi
          if [ "${{ github.event.schedule }}" = "0 13 * * 1" ] && grep -q "enabled: true" config/batch.yaml; then
            echo "Hourly batch mode is on; it keeps entries fresh, so the weekly full run is skipped."; exit 0
          fi
          python scripts/refresh.py "${ARGS[@]}"

      - name: Commit updated data
        run: |
          git config user.name "outreach-bot"
          git config user.email "outreach-bot@users.noreply.github.com"
          git add public/data config/labs.discovered.yaml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh $(date -u +%F)"
          git pull --rebase origin main
          git push

  # Pushes made by the workflow don't trigger other workflows, so deploy explicitly.
  deploy:
    needs: refresh
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
